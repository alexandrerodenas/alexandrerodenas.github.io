    <style>
        body {
            font-family: 'Crimson Pro', serif;
            background-color: #0f0e0d;
            background-image: url('https://www.transparenttextures.com/patterns/dark-leather.png');
            color: #d6d3d1;
            overflow-x: hidden;
            font-size: 18px; /* Base size slightly larger for readability */
        }
        h1, h2, h3, .font-title {
            font-family: 'Uncial Antiqua', cursive;
        }
        .parchment-texture {
            background-color: #eaddcf;
            background-image: url('https://www.transparenttextures.com/patterns/aged-paper.png');
        }
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 150px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 0;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #1c1917; 
        }
        ::-webkit-scrollbar-thumb {
            background: #57534e; 
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #78716c; 
        }
        /* Mood Change Effects */
        @keyframes glow-increase {
            0% { box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
            50% { box-shadow: 0 0 25px 8px rgba(34, 197, 94, 0.7), 0 10px 20px rgba(0,0,0,0.5); } /* green-500 */
            100% { box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        }

        @keyframes glow-decrease {
            0% { box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
            50% { box-shadow: 0 0 25px 8px rgba(239, 68, 68, 0.7), 0 10px 20px rgba(0,0,0,0.5); } /* red-500 */
            100% { box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        }

        .mood-increase-glow {
            animation: glow-increase 1.5s ease-out;
        }

        .mood-decrease-glow {
            animation: glow-decrease 1.5s ease-out;
        }

        @keyframes float-up {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0.9;
                filter: blur(0px);
            }
            100% {
                transform: translateY(-100px) scale(0.5);
                opacity: 0;
                filter: blur(5px);
            }
        }

        .particle {
            position: absolute;
            bottom: 10%;
            animation: float-up 1.5s ease-out forwards;
            border-radius: 50%;
            box-shadow: 0 0 8px currentColor;
        }
        
        /* General & Trait Change Animations */
        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fade-in {
            animation: fade-in 0.5s ease-out forwards;
        }

        @keyframes fade-in-fast {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-fast {
            animation: fade-in-fast 0.2s ease-out forwards;
        }

        .animate-pulse-fast {
            animation: pulse-fast 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-fast {
            50% { opacity: .7; }
        }

        .animate-fade-out-up {
            animation: fade-out-up 4s forwards;
        }
        @keyframes fade-out-up {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-20px) scale(0.8); }
        }
    </style>
